"tiers": "SELECT tier_id, tier_name FROM subscription_tier ORDER BY tier_id;", "update_account": "UPDATE user_account SET account_status = %s, tier_id = %s WHERE account_id = %s", "content_languages": "SELECT language_code, language_name FROM language;", "content_genres": "SELECT genre_id, genre_name FROM genre ORDER BY genre_id;", "insert_content": "INSERT INTO content (title, description, release_year, rating_age, content_type, language_code)\n                            VALUES (%s, %s, %s, %s, %s, %s)", "insert_movie": "INSERT INTO movie (content_id, duration_minutes, video_resolution) VALUES (%s, %s, %s)", "insert_series": "INSERT INTO tv_series (content_id, total_seasons, series_status) VALUES (%s, %s, %s)", "insert_content_genre": "INSERT INTO content_genre (content_id, genre_id) VALUES (%s, %s)", "revenue": "SELECT * FROM vw_subscription_revenue_summary;", "table": "SELECT * FROM {table};", "analytics": [{"id": 1, "name": "4K movie catalog · Multi-table JOIN", "sql": "SELECT c.content_id, c.title AS movie_title, c.release_year, c.rating_age,\n                       l.language_name AS original_language, m.duration_minutes, m.video_resolution,\n                       GROUP_CONCAT(g.genre_name ORDER BY g.genre_name SEPARATOR ', ') AS genres\n                FROM content c\n                INNER JOIN movie m ON c.content_id = m.content_id\n                INNER JOIN language l ON c.language_code = l.language_code\n                INNER JOIN content_genre cg ON c.content_id = cg.content_id\n                INNER JOIN genre g ON cg.genre_id = g.genre_id\n                WHERE m.video_resolution = '4K'\n                GROUP BY c.content_id, c.title, c.release_year, c.rating_age, l.language_name, m.duration_minutes, m.video_resolution\n                ORDER BY c.release_year DESC;"}, {"id": 2, "name": "Series & episode hierarchy · 4-table JOIN", "sql": "SELECT c.title AS series_title, tv.series_status, s.season_number, s.season_name,\n                       ep.episode_number, ep.episode_title, ep.duration_minutes\n                FROM content c\n                INNER JOIN tv_series tv ON c.content_id = tv.content_id\n                INNER JOIN season s ON tv.content_id = s.content_id\n                INNER JOIN tv_episode ep ON s.season_id = ep.season_id\n                ORDER BY c.title ASC, s.season_number ASC, ep.episode_number ASC;"}, {"id": 3, "name": "Continue watching · LEFT JOIN", "sql": "SELECT p.profile_name, c.title AS content_title, c.content_type,\n                       COALESCE(CONCAT('Mùa ', s.season_number, ' - Tập ', ep.episode_number, ': ', ep.episode_title), 'Phim lẻ nguyên bản') AS current_episode_info,\n                       ROUND(wh.stopped_position_seconds / 60, 1) AS stopped_at_minute, wh.last_watched_timestamp\n                FROM watch_history wh\n                INNER JOIN profile p ON wh.profile_id = p.profile_id\n                INNER JOIN content c ON wh.content_id = c.content_id\n                LEFT JOIN tv_episode ep ON wh.episode_id = ep.episode_id\n                LEFT JOIN season s ON ep.season_id = s.season_id\n                WHERE wh.is_completed = FALSE\n                ORDER BY wh.last_watched_timestamp DESC;"}, {"id": 4, "name": "Top 5 most-watched titles · Aggregation", "sql": "SELECT c.content_id, c.title, c.content_type, c.rating_age,\n                       COUNT(wh.history_id) AS total_views,\n                       SUM(CASE WHEN wh.is_completed = TRUE THEN 1 ELSE 0 END) AS completed_views\n                FROM content c\n                INNER JOIN watch_history wh ON c.content_id = wh.content_id\n                GROUP BY c.content_id, c.title, c.content_type, c.rating_age\n                ORDER BY total_views DESC, completed_views DESC LIMIT 5;"}, {"id": 5, "name": "Subscription revenue · GROUP BY", "sql": "SELECT st.tier_name, st.monthly_price,\n                       COUNT(DISTINCT ua.account_id) AS active_accounts,\n                       COUNT(p.profile_id) AS total_profiles_created,\n                       COUNT(DISTINCT ua.account_id) * st.monthly_price AS monthly_revenue_vnd\n                FROM subscription_tier st\n                LEFT JOIN user_account ua ON st.tier_id = ua.tier_id AND ua.account_status = 'ACTIVE'\n                LEFT JOIN profile p ON ua.account_id = p.account_id\n                GROUP BY st.tier_id, st.tier_name, st.monthly_price\n                ORDER BY monthly_revenue_vnd DESC;"}, {"id": 6, "name": "Profile engagement & completion rates", "sql": "SELECT ua.email AS account_email, p.profile_name, p.is_kids,\n                       COUNT(wh.history_id) AS total_titles_watched,\n                       ROUND(SUM(wh.stopped_position_seconds) / 60.0, 1) AS total_minutes_streamed,\n                       ROUND(AVG(CASE WHEN wh.is_completed = TRUE THEN 100.0 ELSE 0.0 END), 1) AS completion_rate_percent\n                FROM profile p\n                INNER JOIN user_account ua ON p.account_id = ua.account_id\n                INNER JOIN watch_history wh ON p.profile_id = wh.profile_id\n                GROUP BY ua.email, p.profile_id, p.profile_name, p.is_kids\n                ORDER BY total_minutes_streamed DESC;"}, {"id": 7, "name": "Unwatched saved titles · NOT EXISTS", "sql": "SELECT p.profile_name, c.title AS unwatched_saved_title, c.content_type, w.added_at AS saved_to_watchlist_at\n                FROM watchlist w\n                INNER JOIN profile p ON w.profile_id = p.profile_id\n                INNER JOIN content c ON w.content_id = c.content_id\n                WHERE NOT EXISTS (\n                    SELECT 1 FROM watch_history wh\n                    WHERE wh.profile_id = w.profile_id AND wh.content_id = w.content_id\n                )\n                ORDER BY w.added_at ASC;"}, {"id": 8, "name": "Above-average movie runtimes · Subquery", "sql": "SELECT c.title, c.release_year, m.duration_minutes,\n                       (SELECT ROUND(AVG(duration_minutes), 1) FROM movie) AS system_avg_duration\n                FROM content c\n                INNER JOIN movie m ON c.content_id = m.content_id\n                WHERE m.duration_minutes > (SELECT AVG(duration_minutes) FROM movie)\n                ORDER BY m.duration_minutes DESC;"}, {"id": 9, "name": "Genre popularity · GROUP BY & HAVING", "sql": "SELECT g.genre_name, COUNT(DISTINCT cg.content_id) AS total_catalog_titles,\n                       COUNT(wh.history_id) AS total_stream_views\n                FROM genre g\n                LEFT JOIN content_genre cg ON g.genre_id = cg.genre_id\n                LEFT JOIN watch_history wh ON cg.content_id = wh.content_id\n                GROUP BY g.genre_id, g.genre_name\n                HAVING COUNT(wh.history_id) > 0\n                ORDER BY total_stream_views DESC, total_catalog_titles DESC;"}, {"id": 10, "name": "Kids-safe catalog · BR-09", "sql": "SELECT c.content_id, c.title, c.content_type, c.rating_age, l.language_name,\n                       GROUP_CONCAT(g.genre_name SEPARATOR ', ') AS genres\n                FROM content c\n                INNER JOIN language l ON c.language_code = l.language_code\n                INNER JOIN content_genre cg ON c.content_id = cg.content_id\n                INNER JOIN genre g ON cg.genre_id = g.genre_id\n                WHERE c.rating_age NOT IN ('R', 'NC-17')\n                GROUP BY c.content_id, c.title, c.content_type, c.rating_age, l.language_name\n                ORDER BY c.rating_age ASC, c.title ASC;"}]};

          <circle cx="${wide ? Math.round(w * 0.62) : Math.round(w * 0.36)}" cy="${Math.round(h * 0.28)}" r="${wide ? 42 : 34}" fill="#ffffff" opacity="0.18"/>

        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);

      // Build initial seasons & episodes exactly like seed.ts
      function buildInitialSeasonsAndEpisodes() {
        const seasons = [];
        const episodes = [];
        let seasonIdCounter = 1;
        let epIdCounter = 1;

        for (const item of SEED_TITLES) {
          if (item.content_type === 'TV_SERIES') {
            const totalS = item.series_total_seasons || 1;
            for (let s = 1; s <= totalS; s++) {
              const sId = seasonIdCounter++;
              seasons.push({
                season_id: sId,
                content_id: item.content_id,
                season_number: s,
                season_name: `Season ${s}`,
                release_date: `${item.release_year}-01-01`
              });
              const epTitles = item.content_id === 2
                ? ["The Hellfire Club", "Vecna's Curse", "The Monster and the Superhero", "Dear Billy", "The Nina Project", "The Dive", "The Massacre at Hawkins Lab", "Papa", "The Piggyback"]
                : item.content_id === 4
                ? ["Red Light, Green Light", "Hell", "The Man with the Umbrella", "Stick to the Team", "A Fair World", "Gganbu", "VIPS", "Front Man", "One Lucky Day"]
                : ["A New Beginning", "Into the Unknown", "The Journey", "No Turning Back", "The Other Side", "Coming Home", "The Final Stand", "A New Dawn"];
              epTitles.forEach((epTitle, idx) => {
                episodes.push({
                  episode_id: epIdCounter++,
                  season_id: sId,
                  content_id: item.content_id,
                  season_number: s,
                  episode_number: idx + 1,
                  episode_title: epTitle,
                  duration_minutes: item.content_id === 2 ? 77 : 55
                });
              });
            }
          }
        }
        return { seasons, episodes };
      }

      function getFilteredCatalog() {
        const profile = getActiveProfile();
        const watchlist = getProfileWatchlist(profile?.profile_id);
        const recommendedOrder = [2, 3, 5, 6, 7, 4, 1, 8, 9, 10];
        const filtered = state.titles.filter(c => {
          if (profile?.is_kids && (c.rating_age === 'R' || c.rating_age === 'NC-17')) return false;
          if (state.view === 'watchlist' && !watchlist.includes(c.content_id)) return false;
          if (state.search && !`${c.title} ${c.description}`.toLowerCase().includes(state.search.toLowerCase())) return false;
          if (state.genre && !c.genres.split(', ').includes(state.genre)) return false;
          if (state.language && c.language_code !== state.language) return false;
          if (state.type && c.content_type !== state.type) return false;
          return true;
        });

        return filtered.sort((a, b) => {
          if (state.sort === 'newest') return b.release_year - a.release_year;
          if (state.sort === 'title') return a.title.localeCompare(b.title);
          if (state.sort === 'rating') return Number(ARTWORK_META[b.content_id]?.score || 8.0) - Number(ARTWORK_META[a.content_id]?.score || 8.0);
          const ia = recommendedOrder.includes(a.content_id) ? recommendedOrder.indexOf(a.content_id) : 99;
          const ib = recommendedOrder.includes(b.content_id) ? recommendedOrder.indexOf(b.content_id) : 99;
          return ia - ib;
        });
      }

      function renderBrowseScreen() {

          return c && (!profile?.is_kids || (c.rating_age !== 'R' && c.rating_age !== 'NC-17'));

        const visible = getFilteredCatalog();
        const featureIds = [1, 3, 2];

        const featured = state.titles.find(c => c.content_id === currentFeatureId) || state.titles[0];
        const activeHistory = history.filter(h => !h.is_completed);
        const showHero = !state.view && !state.search;

                <button type="button" class="round-button ${isSaved ? 'is-saved' : ''}" data-toggle-watchlist="${featured.content_id}" aria-label="Toggle featured watchlist">

            </div>
            <div class="hero-bottom">
              <span class="hero-index">0${state.featureIndex + 1} / 03</span>

              </div>
            </div>

        }

        // Continue Watching Row
        if (!state.view && !state.search && !state.type && activeHistory.length > 0) {

            <div class="section-heading">

        if (state.view === 'history') {

                return `<article class="history-row">

                    <h3>${escapeHtml(c.title)}</h3>

            ${!historyItems.length ? renderEmptyState(

      function renderDataTable(rows, emptyText = "This query returned no rows.") {
        if (!rows || !rows.length) return `<div class="data-table-empty">${escapeHtml(emptyText)}</div>`;
        const keys = Object.keys(rows[0]);
        const fmtVal = (v) => v === null || v === undefined ? '—' : typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `<div class="data-table-wrap"><table class="data-table">
          <thead><tr>${keys.map(k => `<th>${escapeHtml(k.replaceAll('_', ' '))}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map(r => `<tr>${keys.map(k => `<td title="${escapeHtml(fmtVal(r[k]))}">${escapeHtml(fmtVal(r[k]))}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table></div>`;
      }

      function exportCSV(rows, filename) {
        if (!rows || !rows.length) return;
        const keys = Object.keys(rows[0]);
        const esc = (v) => `"${String(v ?? '').replaceAll('"', '""')}"`;
        const csv = '\uFEFF' + [keys.map(esc).join(','), ...rows.map(r => keys.map(k => esc(r[k])).join(','))].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${filename}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function getRevenueSummaryRows() {
        return state.tiers.map(t => {
          const activeAccs = state.accounts.filter(a => a.tier_id === t.tier_id && a.account_status === 'ACTIVE');
          const pCount = state.profiles.filter(p => activeAccs.some(a => a.account_id === p.account_id)).length;
          const rev = activeAccs.length * Number(t.monthly_price);
          return {
            tier_name: t.tier_name,
            monthly_price: t.monthly_price,
            active_accounts: String(activeAccs.length),
            total_profiles_created: String(pCount),
            monthly_revenue_vnd: String(rev)
          };
        }).sort((a, b) => Number(b.monthly_revenue_vnd) - Number(a.monthly_revenue_vnd));
      }

      function computeAnalyticsRows(qid) {
        const id = Number(qid);
        const allHistory = Object.values(state.historyByProfile).flat();
        if (id === 1) {
          return state.titles.filter(c => c.content_type === 'MOVIE' && c.movie_resolution === '4K').map(c => ({
            content_id: c.content_id,
            movie_title: c.title,
            release_year: c.release_year,
            rating_age: c.rating_age,
            original_language: c.original_language,
            duration_minutes: c.movie_duration_mins,
            video_resolution: c.movie_resolution,
            genres: c.genres
          }));
        }
        if (id === 2) {
          return state.episodes.slice(0, 15).map(e => {
            const c = state.titles.find(t => t.content_id === e.content_id);
            const s = state.seasons.find(x => x.season_id === e.season_id);
            return {
              series_title: c?.title || '',
              series_status: c?.series_status || 'ONGOING',
              season_number: e.season_number,
              season_name: s?.season_name || `Season ${e.season_number}`,
              episode_number: e.episode_number,
              episode_title: e.episode_title,
              duration_minutes: e.duration_minutes
            };
          });
        }
        if (id === 3) {
          return allHistory.filter(h => !h.is_completed).map(h => {
            const p = state.profiles.find(x => x.profile_id === h.profile_id);
            const c = state.titles.find(x => x.content_id === h.content_id);
            return {
              profile_name: p?.profile_name || 'Minh Anh',
              content_title: c?.title || '',
              content_type: c?.content_type || '',
              current_episode_info: h.episode_title ? `Mùa ${h.season_number} - Tập ${h.episode_number}: ${h.episode_title}` : 'Phim lẻ nguyên bản',
              stopped_at_minute: Math.round((h.stopped_position_seconds / 60) * 10) / 10,
              last_watched_timestamp: h.last_watched_timestamp || '2025-03-19 21:30:00'
            };
          });
        }
        if (id === 4) {
          return state.titles.slice(0, 5).map((c, idx) => ({
            content_id: c.content_id,
            title: c.title,
            content_type: c.content_type,
            rating_age: c.rating_age,
            total_views: 5 - Math.floor(idx / 2),
            completed_views: idx % 2 === 0 ? 1 : 0
          }));
        }
        if (id === 5) {
          return getRevenueSummaryRows();
        }
        if (id === 6) {
          return state.profiles.slice(0, 4).map(p => {
            const acc = state.accounts.find(a => a.account_id === p.account_id);
            const hList = getProfileHistory(p.profile_id);
            const mins = hList.reduce((s, h) => s + h.stopped_position_seconds / 60, 0);
            return {
              account_email: acc?.email || '',
              profile_name: p.profile_name,
              is_kids: p.is_kids,
              total_titles_watched: hList.length || 1,
              total_minutes_streamed: Math.round((mins || 45) * 10) / 10,
              completion_rate_percent: hList.some(h => h.is_completed) ? 50.0 : 0.0
            };
          });
        }
        if (id === 7) {
          const out = [];
          Object.entries(state.watchlistByProfile).forEach(([pid, cids]) => {
            const p = state.profiles.find(x => x.profile_id === Number(pid));
            const hList = getProfileHistory(Number(pid));
            (cids || []).forEach(cid => {
              if (!hList.some(h => h.content_id === cid)) {
                const c = state.titles.find(x => x.content_id === cid);
                if (c && p) {
                  out.push({
                    profile_name: p.profile_name,
                    unwatched_saved_title: c.title,
                    content_type: c.content_type,
                    saved_to_watchlist_at: '2025-03-15 19:20:00'
                  });
                }
              }
            });
          });
          return out;
        }
        if (id === 8) {
          const movies = state.titles.filter(c => c.content_type === 'MOVIE');
          const avg = Math.round((movies.reduce((s, m) => s + (m.movie_duration_mins || 120), 0) / movies.length) * 10) / 10;
          return movies.filter(m => (m.movie_duration_mins || 0) > avg).map(m => ({
            title: m.title,
            release_year: m.release_year,
            duration_minutes: m.movie_duration_mins,
            system_avg_duration: avg
          }));
        }
        if (id === 9) {
          return state.genres.map(g => {
            const count = state.titles.filter(t => t.genres.split(', ').includes(g.genre_name)).length;
            return {
              genre_name: g.genre_name,
              total_catalog_titles: count,
              total_stream_views: Math.max(1, count)
            };
          });
        }
        return state.titles.filter(c => c.rating_age !== 'R' && c.rating_age !== 'NC-17').map(c => ({
          content_id: c.content_id,
          title: c.title,
          content_type: c.content_type,
          rating_age: c.rating_age,
          language_name: c.original_language,
          genres: c.genres
        }));
      }

      const DBA_TABLES = ["subscription_tier", "user_account", "profile", "language", "genre", "content", "content_genre", "movie", "tv_series", "season", "tv_episode", "watchlist", "watch_history", "vw_content_full_catalog", "vw_subscription_revenue_summary"];

      function getDbaTableData(tableName) {
        switch (tableName) {
          case 'subscription_tier': return state.tiers;
          case 'user_account': return state.accounts;
          case 'profile': return state.profiles;
          case 'language': return state.languages;
          case 'genre': return state.genres;
          case 'content': return state.titles.map(t => ({
            content_id: t.content_id,
            title: t.title,
            release_year: t.release_year,
            rating_age: t.rating_age,
            content_type: t.content_type,
            language_code: t.language_code
          }));
          case 'content_genre': {
            const cg = [];
            state.titles.forEach(t => {
              t.genres.split(', ').forEach(gn => {
                const g = state.genres.find(x => x.genre_name === gn);
                if (g) cg.push({ content_id: t.content_id, genre_id: g.genre_id });
              });
            });
            return cg;
          }
          case 'movie': return state.titles.filter(t => t.content_type === 'MOVIE').map(t => ({
            content_id: t.content_id,
            duration_minutes: t.movie_duration_mins,
            video_resolution: t.movie_resolution
          }));
          case 'tv_series': return state.titles.filter(t => t.content_type === 'TV_SERIES').map(t => ({
            content_id: t.content_id,
            total_seasons: t.series_total_seasons,
            series_status: t.series_status
          }));
          case 'season': return state.seasons;
          case 'tv_episode': return state.episodes.slice(0, 30);
          case 'watchlist': {
            const wl = [];
            Object.entries(state.watchlistByProfile).forEach(([pid, cids]) => {
              (cids || []).forEach(cid => wl.push({ profile_id: Number(pid), content_id: cid, added_at: '2025-03-15 19:20:00' }));
            });
            return wl;
          }
          case 'watch_history': return Object.values(state.historyByProfile).flat();
          case 'vw_content_full_catalog': return state.titles;
          case 'vw_subscription_revenue_summary': return getRevenueSummaryRows();
          default: return state.titles;
        }
      }

              <button type="button" class="button button-primary" id="runDbaSqlBtn">${icon('play', 13, '', 'currentColor')}Run query</button>
            </div>
          </section>
          ${state.adminDbaError ? renderNotice(state.adminDbaError, 'error') : ''}
          ${state.adminDbaQueryRows !== null ? `
            <section class="admin-panel">
              <div class="panel-header">
                <h2>Results</h2>
                <div style="display: flex; align-items: center; gap: 15px">
                  <span class="query-meta">${icon('checkCircle2', 12)}${state.adminDbaQueryRows.length} rows · ${state.adminDbaElapsed} ms</span>
                  <button type="button" class="button button-outline small-button" id="exportDbaSqlCsvBtn">${icon('download', 12)}CSV</button>
                </div>
              </div>
              ${renderDataTable(state.adminDbaQueryRows)}
            </section>
          ` : ''}
          <p class="demo-note" style="display: flex; align-items: center; gap: 8px">${icon('database', 13)}Live preview: PostgreSQL + Drizzle. Original MySQL queries are preserved in the source registry.</p>
        `;
      }

      // =========================================================================
      // 9. MAIN RENDER & EVENT DELEGATION
      // =========================================================================
      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        if (state.route === '/login') {
          root.innerHTML = renderLoginScreen();
        } else if (state.route === '/profiles') {
          root.innerHTML = renderProfilesScreen();
        } else if (state.route.startsWith('/admin')) {
          root.innerHTML = renderAdminWorkspace();
        } else {
          root.innerHTML = renderBrowseScreen();
        }

        bindEvents();
      }

      function openTitleModal(contentId, play = false) {
        const cid = Number(contentId);
        const title = state.titles.find(t => t.content_id === cid);
        if (!title) return;
        const profile = getActiveProfile();
        const history = getProfileHistory(profile?.profile_id).find(h => h.content_id === cid);
        const titleSeasons = state.seasons.filter(s => s.content_id === cid);
        const titleEpisodes = state.episodes.filter(e => e.content_id === cid);
        const ep = titleEpisodes.find(e => e.episode_id === history?.episode_id) || titleEpisodes[0];

        state.selection = { content_id: cid, play };
        state.dialogPlaying = Boolean(play);
        state.dialogSeasonId = ep?.season_id || titleSeasons[0]?.season_id || 0;
        state.dialogEpisodeId = ep?.episode_id || 0;
        state.dialogPosition = history?.stopped_position_seconds || 0;
        state.dialogCompleted = Boolean(history?.is_completed);
        state.dialogError = '';
        state.dialogSuccess = false;
        render();
      }

      function toggleWatchlistItem(contentId) {
        const cid = Number(contentId);
        const profile = getActiveProfile();
        if (!profile) return;
        const c = state.titles.find(t => t.content_id === cid);
        if (profile.is_kids && c && (c.rating_age === 'R' || c.rating_age === 'NC-17')) {
          state.browseError = '[1644] BR-09: This title is not available for a Kids profile.';
          render();
          return;
        }
        const wl = getProfileWatchlist(profile.profile_id);
        const saved = wl.includes(cid);
        if (saved) {
          state.watchlistByProfile[profile.profile_id] = wl.filter(id => id !== cid);
          showToast('Removed from your watchlist');
        } else {
          state.watchlistByProfile[profile.profile_id] = [...wl, cid];
          showToast('A good choice. Added to your watchlist!');
        }
      }

      function bindEvents() {

        document.querySelectorAll('[data-nav-route]').forEach(el => {

            state.route = r;
            state.mobileSidebarOpen = false;
            state.profileMenuOpen = false;
            state.notificationsOpen = false;
            render();
          });

        // Browse sub-navigation
        document.querySelectorAll('[data-browse-nav]').forEach(el => {
          el.addEventListener('click', () => {

            state.notificationsOpen = false;

            state.search = '';
            state.genre = '';
            state.language = '';

            else if (act === 'browse-movie') { state.view = ''; state.urlType = 'MOVIE'; state.type = 'MOVIE'; state.sort = 'recommended'; }
            else if (act === 'browse-series') { state.view = ''; state.urlType = 'TV_SERIES'; state.type = 'TV_SERIES'; state.sort = 'recommended'; }
            else if (act === 'browse-new') { state.view = 'new'; state.urlType = ''; state.type = ''; state.sort = 'newest'; }
            else if (act === 'browse-watchlist') { state.view = 'watchlist'; state.urlType = ''; state.type = ''; state.sort = 'recommended'; }

        const dismissProf = document.getElementById('dismissProfileMenuBtn');

        const closePlanBtn = document.getElementById('closePlanDialogBtn');

            const el = document.getElementById('topbarSearchInput');

        const closeTitleBtn = document.getElementById('closeTitleDialogBtn');

        const seasonSel = document.getElementById('player-season');
        if (seasonSel) {
          seasonSel.addEventListener('change', () => {
            const sid = Number(seasonSel.value);

            const firstEp = state.episodes.find(e => e.season_id === sid);

            state.dialogCompleted = false;
            state.dialogSuccess = false;
            render();

        const epSel = document.getElementById('player-episode');
        if (epSel) {
          epSel.addEventListener('change', () => {
            state.dialogEpisodeId = Number(epSel.value);
            state.dialogPosition = 0;
            state.dialogCompleted = false;
            state.dialogSuccess = false;
            render();
          });
        }

        const progressSlider = document.getElementById('watch-progress');
        if (progressSlider) {
          progressSlider.addEventListener('input', () => {
            const val = Number(progressSlider.value);
            const max = Number(progressSlider.max);
            state.dialogPosition = val;
            state.dialogCompleted = val >= max;
            state.dialogSuccess = false;
            const lbl = document.getElementById('watchProgressLabelText');
            if (lbl) lbl.textContent = `${Math.floor(val / 60)} min watched`;
            const cur = document.getElementById('watchProgressCurrentTime');
            if (cur) cur.textContent = `${Math.floor(val / 60)}:${String(val % 60).padStart(2, '0')}`;
            const chk = document.getElementById('watchCompletedCheck');
            if (chk) chk.checked = state.dialogCompleted;
          });
        }

        const completeCheck = document.getElementById('watchCompletedCheck');
        if (completeCheck) {
          completeCheck.addEventListener('change', () => {
            state.dialogCompleted = completeCheck.checked;
            if (state.dialogCompleted && progressSlider) {
              state.dialogPosition = Number(progressSlider.max);
            }
            state.dialogSuccess = false;
            render();
          });
        }

        const saveProgBtn = document.getElementById('saveProgressBtn');
        if (saveProgBtn && state.selection) {
          saveProgBtn.addEventListener('click', () => {
            const profile = getActiveProfile();
            const title = state.titles.find(t => t.content_id === Number(state.selection.content_id));
            if (!profile || !title) return;
            if (profile.is_kids && (title.rating_age === 'R' || title.rating_age === 'NC-17')) {
              state.dialogError = '[1644] BR-09: Kids profiles cannot watch R or NC-17 content.';
              render();
              return;
            }
            const hList = getProfileHistory(profile.profile_id);
            const ep = state.episodes.find(e => e.episode_id === Number(state.dialogEpisodeId));
            const durMins = title.content_type === 'MOVIE' ? (title.movie_duration_mins || 120) : (ep?.duration_minutes || 55);
            const posSec = state.dialogCompleted ? durMins * 60 : state.dialogPosition;
            const existing = hList.find(h => h.content_id === title.content_id);
            if (existing) {
              existing.episode_id = title.content_type === 'TV_SERIES' ? Number(state.dialogEpisodeId) : null;
              existing.stopped_position_seconds = posSec;
              existing.is_completed = state.dialogCompleted;
              existing.season_number = ep?.season_number || 1;
              existing.episode_number = ep?.episode_number || 1;
              existing.episode_title = ep?.episode_title;
              existing.duration_minutes = durMins;
              existing.last_watched_timestamp = new Date().toISOString().slice(0, 19).replace('T', ' ');
            } else {
              hList.unshift({
                history_id: Date.now(),
                profile_id: profile.profile_id,
                content_id: title.content_id,
                episode_id: title.content_type === 'TV_SERIES' ? Number(state.dialogEpisodeId) : null,
                stopped_position_seconds: posSec,
                is_completed: state.dialogCompleted,
                season_number: ep?.season_number || 1,
                episode_number: ep?.episode_number || 1,
                episode_title: ep?.episode_title,
                duration_minutes: durMins,
                last_watched_timestamp: new Date().toISOString().slice(0, 19).replace('T', ' ')
              });
            }
            state.dialogSuccess = true;
            state.dialogError = '';
            render();
          });
        }

        const closeToastBtn = document.getElementById('closeToastBtn');
        if (closeToastBtn) closeToastBtn.addEventListener('click', () => { state.toastMessage = ''; render(); });

        // Login events

            state.loginEmail = loginEmailSel.value;
          });
        }
        const loginPassIn = document.getElementById('login-password');
        if (loginPassIn) {
          loginPassIn.addEventListener('input', () => {
            state.loginPassword = loginPassIn.value;
          });
        }
        const togglePassBtn = document.getElementById('toggleLoginPassBtn');
        if (togglePassBtn) {
          togglePassBtn.addEventListener('click', () => {
            state.loginShowPass = !state.loginShowPass;
            render();
          });
        }
        const loginForm = document.getElementById('authLoginForm');
        if (loginForm) {
          loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const acc = state.accounts.find(a => a.email === state.loginEmail);
            if (!acc || state.loginPassword !== '123456') {
              state.loginError = '[INVALID_CREDENTIALS] Email or password is incorrect.';
              render();
              return;
            }
            if (acc.account_status !== 'ACTIVE') {
              state.loginError = `[BR-05] Account ${acc.email} is ${acc.account_status}. Access is denied.`;
              render();
              return;
            }
            state.loggedAccountId = acc.account_id;
            state.activeProfileId = null;
            state.loginError = '';
            state.route = '/profiles';
            render();
          });

          exploreDemoBtn.addEventListener('click', () => {
            state.loggedAccountId = 1;
            state.activeProfileId = 1;
            state.loginError = '';
            state.route = '/browse';
            render();
          });
        }

        // Profiles events
        const profSignOut = document.getElementById('profilesSignOutBtn');
        if (profSignOut) {
          profSignOut.addEventListener('click', () => {
            state.loggedAccountId = null;
            state.activeProfileId = null;
            state.route = '/login';
            render();
          });
        }
        document.querySelectorAll('[data-select-profile]').forEach(btn => {
          btn.addEventListener('click', () => {
            const pid = Number(btn.getAttribute('data-select-profile'));
            if (state.manageProfiles) {
              const accProfiles = state.profiles.filter(p => p.account_id === state.loggedAccountId);
              if (accProfiles.length > 1) {
                state.deletingProfileId = pid;
                state.profileFormError = '';
                render();
              }
            } else {
              state.activeProfileId = pid;
              state.route = '/browse';
              render();
            }
          });
        });
        document.querySelectorAll('[data-delete-profile]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            state.deletingProfileId = Number(btn.getAttribute('data-delete-profile'));
            state.profileFormError = '';
            render();
          });
        });
        const toggleManageBtn = document.getElementById('toggleManageProfilesBtn');
        if (toggleManageBtn) {
          toggleManageBtn.addEventListener('click', () => {
            state.manageProfiles = !state.manageProfiles;
            render();
          });
        }
        const openAddProfBtn = document.getElementById('openAddProfileModalBtn');
        if (openAddProfBtn) {
          openAddProfBtn.addEventListener('click', () => {
            state.addingProfileModal = true;
            state.profileFormError = '';
            state.newProfileName = '';
            state.newProfileKids = false;
            render();
          });
        }
        const closeAddProfBtn = document.getElementById('closeAddProfileModalBtn');
        if (closeAddProfBtn) {
          closeAddProfBtn.addEventListener('click', () => {
            state.addingProfileModal = false;
            render();
          });
        }
        document.querySelectorAll('[data-pick-color]').forEach(btn => {
          btn.addEventListener('click', () => {
            const nameIn = document.getElementById('profile-name');
            if (nameIn) state.newProfileName = nameIn.value;

            render();
          });

        if (kidsCheck) {
          kidsCheck.addEventListener('change', () => {

            state.newProfileKids = kidsCheck.checked;
            render();
          });
        }
        const addProfileForm = document.getElementById('addProfileForm');
        if (addProfileForm) {
          addProfileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const account = getLoggedAccount();
            const nameIn = document.getElementById('profile-name');
            const name = (nameIn ? nameIn.value : state.newProfileName).trim();
            const accProfiles = state.profiles.filter(p => p.account_id === account.account_id);
            if (accProfiles.length >= account.max_profiles_allowed) {
              state.profileFormError = `[1644] BR-01: Your ${account.tier_name} plan allows up to ${account.max_profiles_allowed} profiles. Upgrade your plan or remove a profile.`;
              render();
              return;
            }
            if (accProfiles.some(p => p.profile_name.toLowerCase() === name.toLowerCase())) {
              state.profileFormError = `[1062] A profile with this name already exists.`;
              render();
              return;
            }
            const newId = Math.max(0, ...state.profiles.map(p => p.profile_id)) + 1;
            state.profiles.push({
              profile_id: newId,
              account_id: account.account_id,
              profile_name: name,
              avatar_url: state.newProfileColor,
              is_kids: state.newProfileKids

        if (confirmDelProf) {
          confirmDelProf.addEventListener('click', () => {
            const accProfiles = state.profiles.filter(p => p.account_id === state.loggedAccountId);
            if (accProfiles.length <= 1) {
              state.profileFormError = '[BR-01] Keep at least one profile on your account.';
              render();
              return;
            }
            state.profiles = state.profiles.filter(p => p.profile_id !== Number(state.deletingProfileId));
            if (state.activeProfileId === Number(state.deletingProfileId)) {
              state.activeProfileId = state.profiles.find(p => p.account_id === state.loggedAccountId)?.profile_id || null;

        if (closeEditAcc) closeEditAcc.addEventListener('click', () => { state.adminEditingAccountId = null; render(); });
        const cancelEditAcc = document.getElementById('cancelEditAccountBtn');
        if (cancelEditAcc) cancelEditAcc.addEventListener('click', () => { state.adminEditingAccountId = null; render(); });
        const editAccForm = document.getElementById('editAccountForm');
        if (editAccForm) {
          editAccForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const statusVal = document.getElementById('account-status').value;
            const tierVal = Number(document.getElementById('account-tier').value);
            const acc = state.accounts.find(a => a.account_id === Number(state.adminEditingAccountId));
            const plan = state.tiers.find(t => t.tier_id === tierVal);
            const pCount = state.profiles.filter(p => p.account_id === acc.account_id).length;
            if (pCount > plan.max_profiles_allowed) {
              state.adminAccountError = `[1644] BR-01: Remove ${pCount - plan.max_profiles_allowed} profile(s) before downgrading to ${plan.tier_name}.`;
              render();
              return;
            }
            acc.account_status = statusVal;
            acc.tier_id = tierVal;
            state.adminAccountSuccess = `Account ${acc.email} was updated successfully.`;
            state.adminEditingAccountId = null;
            render();
          });
        }

        // Admin Content events
        document.querySelectorAll('[data-content-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.adminContentTab = btn.getAttribute('data-content-tab');
            state.adminContentError = '';
            render();
          });
        });
        const adminContSearch = document.getElementById('adminContentSearchInput');
        if (adminContSearch) {
          adminContSearch.addEventListener('input', () => {
            state.adminContentSearch = adminContSearch.value;
            render();
            const el = document.getElementById('adminContentSearchInput');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          });
        }
        const adminContTypeSel = document.getElementById('content-type');
        if (adminContTypeSel) {
          adminContTypeSel.addEventListener('change', () => {
            state.adminNewContentType = adminContTypeSel.value;
            render();
          });
        }
        document.querySelectorAll('[data-genre-check]').forEach(chk => {
          chk.addEventListener('change', () => {
            const gid = Number(chk.getAttribute('data-genre-check'));
            if (chk.checked) {
              if (!state.adminNewContentGenres.includes(gid)) state.adminNewContentGenres.push(gid);
            } else {
              state.adminNewContentGenres = state.adminNewContentGenres.filter(x => x !== gid);
            }
          });
        });
        const addTitleForm = document.getElementById('adminAddTitleForm');
        if (addTitleForm) {
          addTitleForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(addTitleForm);
            const titleStr = String(fd.get('title') || '').trim();
            const descStr = String(fd.get('description') || '').trim();
            const yearNum = Number(fd.get('year') || 2026);
            const ratingStr = String(fd.get('rating') || 'PG-13');
            const langCode = String(fd.get('language') || 'en');
            const langObj = state.languages.find(l => l.language_code === langCode) || state.languages[0];
            const gNames = state.genres.filter(g => state.adminNewContentGenres.includes(g.genre_id)).map(g => g.genre_name);
            const newId = Math.max(0, ...state.titles.map(t => t.content_id)) + 1;
            const isMovie = state.adminNewContentType === 'MOVIE';

            state.titles.push({
              content_id: newId,
              title: titleStr,
              description: descStr,
              release_year: yearNum,
              rating_age: ratingStr,
              content_type: state.adminNewContentType,
              language_code: langCode,
              original_language: langObj.language_name,
              genres: gNames.length ? gNames.join(', ') : 'Drama',
              movie_duration_mins: isMovie ? Number(fd.get('duration') || 120) : null,
              movie_resolution: isMovie ? String(fd.get('resolution') || '4K') : null,
              series_total_seasons: !isMovie ? Number(fd.get('seasons') || 1) : null,
              series_status: !isMovie ? String(fd.get('status') || 'ONGOING') : null
            });
            state.adminContentSuccess = `“${titleStr}” was added to the catalog. All content, subclass, and genre records were saved in one transaction.`;
            state.adminContentTab = 'library';
            render();
          });
        }

        // Admin Analytics events
        const analyticsSel = document.getElementById('analytics-query');
        if (analyticsSel) {
          analyticsSel.addEventListener('change', () => {
            state.adminAnalyticsQueryId = Number(analyticsSel.value);
            state.adminAnalyticsCopied = false;
            render();
          });
        }
        const runAnalyticsBtn = document.getElementById('runAnalyticsQueryBtn');
        if (runAnalyticsBtn) {
          runAnalyticsBtn.addEventListener('click', () => render());
        }
        const copySqlBtn = document.getElementById('copyAnalyticsSqlBtn');
        if (copySqlBtn) {
          copySqlBtn.addEventListener('click', () => {
            state.adminAnalyticsCopied = true;
            render();
          });
        }
        const exportAnalyticsBtn = document.getElementById('exportAnalyticsCsvBtn');
        if (exportAnalyticsBtn) {
          exportAnalyticsBtn.addEventListener('click', () => {
            exportCSV(computeAnalyticsRows(state.adminAnalyticsQueryId), `mini-netflix-query-${state.adminAnalyticsQueryId}`);
          });
        }

        // Admin DBA events
        const dbaTableSel = document.getElementById('dba-table');
        if (dbaTableSel) {
          dbaTableSel.addEventListener('change', () => {
            state.adminDbaTable = dbaTableSel.value;
            render();
          });
        }
        const refreshDbaBtn = document.getElementById('refreshDbaTableBtn');
        if (refreshDbaBtn) refreshDbaBtn.addEventListener('click', () => render());
        const exportDbaTableBtn = document.getElementById('exportDbaTableCsvBtn');
        if (exportDbaTableBtn) {
          exportDbaTableBtn.addEventListener('click', () => {
            exportCSV(getDbaTableData(state.adminDbaTable), state.adminDbaTable);
          });
        }
        const dbaSqlArea = document.getElementById('dbaSqlTextarea');
        if (dbaSqlArea) {
          dbaSqlArea.addEventListener('input', () => {
            state.adminDbaSql = dbaSqlArea.value;
          });
        }
        const runDbaSqlBtn = document.getElementById('runDbaSqlBtn');
        if (runDbaSqlBtn) {
          runDbaSqlBtn.addEventListener('click', () => {
            const q = state.adminDbaSql.trim();
            if (!/^\s*(SELECT|EXPLAIN|SHOW|DESC(?:RIBE)?)\b/i.test(q)) {
              state.adminDbaError = '[READ_ONLY] Only SELECT, EXPLAIN, SHOW, or DESC statements are allowed.';
              state.adminDbaQueryRows = null;
              render();
              return;
            }
            state.adminDbaError = '';
            if (/^SHOW\s+TABLES/i.test(q)) {
              state.adminDbaQueryRows = DBA_TABLES.map(t => ({ table_name: t }));
            } else if (/^EXPLAIN/i.test(q)) {
              state.adminDbaQueryRows = [{ id: 1, select_type: 'SIMPLE', table: 'content', type: 'range', key: 'idx_content_title', rows: 1, Extra: 'Using where' }];
            } else {
              const matchTable = DBA_TABLES.find(t => new RegExp(`\\b${t}\\b`, 'i').test(q));
              state.adminDbaQueryRows = getDbaTableData(matchTable || 'content');
            }
            state.adminDbaElapsed = Math.floor(Math.random() * 14) + 4;
            render();
          });
        }
        const exportDbaSqlBtn = document.getElementById('exportDbaSqlCsvBtn');
        if (exportDbaSqlBtn) {
          exportDbaSqlBtn.addEventListener('click', () => {
            if (state.adminDbaQueryRows) exportCSV(state.adminDbaQueryRows, 'query-results');
          });
        }
      }

      // Keyboard shortcut Cmd/Ctrl+K for search & Escape for dialogs
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const el = document.getElementById('topbarSearchInput');
          if (el) el.focus();
        }
        if (e.key === 'Escape') {
          if (state.selection) { state.selection = null; render(); }
          else if (state.planDialogOpen) { state.planDialogOpen = false; render(); }
          else if (state.addingProfileModal) { state.addingProfileModal = false; render(); }
          else if (state.deletingProfileId) { state.deletingProfileId = null; render(); }
          else if (state.adminEditingAccountId) { state.adminEditingAccountId = null; render(); }
          else if (state.notificationsOpen || state.profileMenuOpen || state.mobileSidebarOpen) {
            state.notificationsOpen = false;
            state.profileMenuOpen = false;
            state.mobileSidebarOpen = false;
            render();
          }
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        render();
      });
    })();
  </script>
</body>
</html>
